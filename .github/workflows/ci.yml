# .github/workflows/ci.yml
name: CI/CD - Test and Deploy the Model

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Train the model
        run: python src/train.py

      - name: Run tests
        run: pytest tests/ -v

  deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -f Dockerfile.serve -t news-engagement-api:latest .

      - name: Load image into local Kind cluster
        run: kind load docker-image news-engagement-api:latest --name news-cluster

      - name: Delete the running pod to force a fresh restart
        # KServe's controller reverts "kubectl rollout restart" annotations,
        # since it reconciles the Deployment to match its own desired state.
        # Deleting the pod directly bypasses this - the ReplicaSet immediately
        # recreates it, picking up the freshly loaded image.
        run: kubectl delete pod -l app=isvc.news-engagement-isvc-predictor

      - name: Wait for the new pod to be ready
        run: |
          sleep 5
          kubectl wait --for=condition=Ready pod -l app=isvc.news-engagement-isvc-predictor --timeout=120s

      - name: Verify deployment
        run: kubectl get pods -o wide | grep news-engagement-isvc